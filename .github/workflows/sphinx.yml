name: Sphinx build
on:
  push:
    paths:
      - 'manual/**'
      - 'scripts/**'
      - 'src/ipelua/*.txt'
      - '.github/workflows/sphinx.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build HTML
      uses: ammaraskar/sphinx-action@master
      with:
        docs-folder: "manual/"
        build-command: "sphinx-build -M html . ../build"
    - name: Generate documentation for AI assistants (llms.txt)
      run: |
        sudo apt-get install -y lua5.4
        # the Sphinx container created the directory as root
        sudo lua5.4 manual/llms/mkllms.lua build/html https://otfried.github.io/ipe/
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ipe-manual
        path: build/html/
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/master'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build/html
