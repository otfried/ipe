name: Build Ipe Electron edition for Windows
on:
  workflow_dispatch:
jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Download dependencies
        run: |
          Invoke-WebRequest https://github.com/otfried/emscripten-ipe/releases/download/2026.09.17/emscripten-2026.09.17.tar.gz -OutFile emscripten.tar.gz
          tar xzf emscripten.tar.gz
      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'
      - name: Verify emsdk
        run: emcc -v
      - name: Compile
        run: |
          cd src
          make -j ipe IPEDEPS=$pwd/../emscripten IPEWASM=1
      - name: Build electron
        run: |
          cd src/ipe-electron
          pnpm install
          pnpm run build
          pnpm run make
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          path: src/ipe-electron/out/make/*/x64/*
          retention-days: 2
      - run: 'echo "Status ${{ job.status }}"'
