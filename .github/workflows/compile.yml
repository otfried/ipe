name: Build Ipe
on:
  push:
    paths:
      - '.github/workflows/compile.yml'
      - 'src/**'
      - '!src/ipe-vscode/**'
      - '!src/ipe-web/**'
      - '!src/**/*_cocoa.*'
      - '!src/**/*_win.*'
      - '!src/**/*_js.*'
jobs:
  BuildQt2404:
    runs-on: ubuntu-24.04
    env:
      IPEPREFIX: /usr/local
      IPESTRICT: 1
      IPEQVORONOI: 1
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install \
                  qt6-base-dev qt6-base-dev-tools \
                  libfreetype6-dev libcairo2-dev \
                  libjpeg8-dev libpng-dev \
                  libgsl-dev libspiro-dev libqhull-r8.0 libqhull-dev \
                  liblua5.4-dev lua5.4
      - name: Compile
        run: |
          cd src
          make LUA_PACKAGE=lua5.4
      - run: 'echo "Status ${{ job.status }}"'
  BuildQt2604:
    runs-on: ubuntu-26.04
    env:
      IPEPREFIX: /usr/local
      IPESTRICT: 1
      IPEQVORONOI: 1
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install \
                  qt6-base-dev qt6-base-dev-tools libqtspell-qt6-dev \
                  libfreetype6-dev libcairo2-dev \
                  libjpeg8-dev libpng-dev \
                  libgsl-dev libspiro-dev libqhull-r8.0 libqhull-dev \
                  liblua5.5-dev lua5.5
      - name: Compile
        run: |
          cd src
          make IPE_SPELLCHECK=1
      - run: 'echo "Status ${{ job.status }}"'
  BuildGTK:
    runs-on: ubuntu-26.04
    env:
      IPEPREFIX: /usr/local
      IPESTRICT: 1
      IPEQVORONOI: 1
      IPEUI: GTK
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install \
                  libgtk2.0-dev \
                  libfreetype6-dev libcairo2-dev \
                  libjpeg8-dev libpng-dev \
                  libgsl-dev libspiro-dev libqhull-r8.0 libqhull-dev \
                  liblua5.5-dev lua5.5
      - name: Compile
        run: |
          cd src
          make
      - run: 'echo "Status ${{ job.status }}"'
